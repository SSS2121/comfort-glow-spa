<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#0D2F26" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="description"
    content="Selecciona español o inglés para explorar los servicios de belleza y bienestar a domicilio de D3 Glow Spa." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="D3 Glow Spa" />
  <meta property="og:title" content="D3 Glow Spa Mobile" />
  <meta property="og:description"
    content="Servicios bilingües de uñas, faciales, depilación y bienestar a domicilio." />
  <meta name="twitter:card" content="summary_large_image" />
  <title>D3 Glow Spa Mobile</title>
  <link rel="icon" href="/images/Logos/favicon-d3-glow-spa-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/images/Logos/favicon-d3-glow-spa-180.png" sizes="180x180" />
  <link rel="stylesheet" href="/src/styles.css" />
  <script type="module" src="/src/locale-router.js"></script>
</head>

<body class="language-gateway">
  <main class="gateway-card" aria-labelledby="gateway-title">
    <div class="gateway-logo-frame">
      <img src="/images/Logos/logo-d3-glow-spa-640.png"
        srcset="/images/Logos/logo-d3-glow-spa-320.png 320w, /images/Logos/logo-d3-glow-spa-640.png 640w, /images/Logos/logo-d3-glow-spa-1280.png 1280w"
        sizes="(max-width: 38rem) 86vw, 34rem" alt="D3 Glow Spa, servicios móviles" width="1280" height="471"
        decoding="async" />
    </div>
    <p class="eyebrow">Belleza · Bienestar</p>
    <h1 id="gateway-title">Elige tu idioma<br /><span>Choose your language</span></h1>
    <p class="gateway-copy">
      Explora nuestros servicios de belleza.
    </p>
    <p class="gateway-copy">
      Explore our beauty services.
    </p>

    <nav class="gateway-actions" aria-label="Language selection">
      <button class="button button--gold" data-language-choice="es">Español</button>
      <button class="button button--gold  " data-language-choice="en">English</button>
    </nav>
    <p class="gateway-status" data-gateway-status aria-live="polite"></p>
  </main>
</body>

</html>
